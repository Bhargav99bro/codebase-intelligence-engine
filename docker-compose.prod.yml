services:
  db:
    image: postgres:16-alpine
    container_name: cie-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-codebase_intelligence}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-codebase_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cie-prod-network

  redis:
    image: redis:7-alpine
    container_name: cie-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cie-prod-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    container_name: cie-prod-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PROJECT_NAME=Codebase Intelligence Engine
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-https://cie.example.com}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-codebase_intelligence}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ANALYSIS_STORAGE_PATH=/tmp/cie_repos
      - RATE_LIMIT_ENABLED=true
      - MAX_CONCURRENT_ANALYSES=5
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cie-prod-network

  worker:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    container_name: cie-prod-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - PROJECT_NAME=Codebase Intelligence Engine
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-codebase_intelligence}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ANALYSIS_STORAGE_PATH=/tmp/cie_repos
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "ingestion", "--concurrency=4"]
    networks:
      - cie-prod-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
    container_name: cie-prod-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - cie-prod-network

volumes:
  prod_postgres_data:
  prod_redis_data:

networks:
  cie-prod-network:
    driver: bridge
