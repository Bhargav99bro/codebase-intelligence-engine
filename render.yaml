services:
  # 1. FastAPI ASGI Backend
  - type: web
    name: cie-backend
    runtime: docker
    dockerfilePath: docker/backend.prod.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/ready
    envVars:
      - key: PROJECT_NAME
        value: Codebase Intelligence Engine
      - key: VERSION
        value: 1.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cie-db
          property: connectionString
      - key: REDIS_URL
        value: redis://cie-redis:6379/0
      - key: ANALYSIS_STORAGE_PATH
        value: /tmp/cie_repos
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: MAX_CONCURRENT_ANALYSES
        value: 5
      - key: BACKEND_CORS_ORIGINS
        value: "*"

  # 2. Celery Asynchronous Worker
  - type: worker
    name: cie-worker
    runtime: docker
    dockerfilePath: docker/backend.prod.Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q ingestion --concurrency=4
    envVars:
      - key: PROJECT_NAME
        value: Codebase Intelligence Engine
      - key: VERSION
        value: 1.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        fromService:
          type: web
          name: cie-backend
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cie-db
          property: connectionString
      - key: REDIS_URL
        value: redis://cie-redis:6379/0
      - key: ANALYSIS_STORAGE_PATH
        value: /tmp/cie_repos

  # 3. Redis Private Service
  - type: pserv
    name: cie-redis
    runtime: image
    image:
      url: redis:7-alpine
    plan: starter

  # 4. React Production Frontend
  - type: static_site
    name: cie-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cie-backend
          property: host

databases:
  - name: cie-db
    databaseName: codebase_intelligence
    user: cie_admin
    plan: free
