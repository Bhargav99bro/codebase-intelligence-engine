services:
  # Unified FastAPI Backend + Celery Worker (Card-Free Free Tier Web Service)
  - type: web
    name: cie-backend
    runtime: docker
    dockerfilePath: docker/backend.prod.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/ready
    envVars:
      - key: PORT
        value: 10000
      - key: PROJECT_NAME
        value: Codebase Intelligence Engine
      - key: VERSION
        value: 1.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: https://frontend-mauve-omega-jwwyldr41f.vercel.app
      - key: ANALYSIS_STORAGE_PATH
        value: /tmp/cie_repos
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: MAX_CONCURRENT_ANALYSES
        value: 5

